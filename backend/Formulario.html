<!DOCTYPE html>
<!--
  Agregar una reserva a mano — las que llegan por teléfono, por WhatsApp
  o en el mesón y no pasan por Shopify.

  Va en el proyecto de Apps Script como un archivo HTML llamado
  "Formulario" (el + de arriba a la izquierda → HTML). El nombre importa:
  abrirFormulario() lo busca así.

  Claro y no con el negro de la marca a propósito: esto se abre encima de
  una planilla blanca y es una herramienta de trabajo, no el sitio.
-->
<html>
<head>
<base target="_top">
<style>
  :root{
    --gold:#9A7B18; --tinta:#1A1A18; --suave:#5F5C55; --linea:#D8D5CC;
    --ok:#3E7D4F; --alerta:#C9872A; --error:#A33;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:18px 20px; background:#fff; color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:14px;
  }
  h1{ margin:0 0 16px; font-size:0.78rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.09em; color:var(--gold); }

  label{ display:block; font-size:0.74rem; font-weight:600; color:var(--suave);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; }
  input[type=text], input[type=number], input[type=email], select{
    width:100%; padding:9px 10px; border:1px solid var(--linea); border-radius:3px;
    font-size:0.92rem; font-family:inherit; color:var(--tinta); background:#fff;
  }
  input:focus, select:focus{ outline:2px solid var(--gold); outline-offset:-1px; border-color:var(--gold); }

  .fila{ display:flex; gap:12px; margin-bottom:14px; }
  .fila > div{ flex:1; }
  .nota{ font-size:0.74rem; color:var(--suave); margin:4px 0 0; font-weight:400;
    text-transform:none; letter-spacing:0; }

  fieldset{ border:1px solid var(--linea); border-radius:3px; padding:12px 14px 14px;
    margin:0 0 14px; }
  legend{ font-size:0.74rem; font-weight:600; color:var(--suave);
    text-transform:uppercase; letter-spacing:0.05em; padding:0 6px; }
  .menus{ display:flex; gap:12px; }
  .menus > div{ flex:1; }
  .menus label{ text-transform:none; letter-spacing:0; font-size:0.84rem;
    color:var(--tinta); font-weight:500; }

  .pie{ display:flex; align-items:center; gap:12px; margin-top:4px; }
  button{
    padding:10px 20px; border:0; border-radius:3px; cursor:pointer;
    font-family:inherit; font-size:0.86rem; font-weight:600;
    background:var(--gold); color:#fff;
  }
  button.secundario{ background:none; color:var(--suave); border:1px solid var(--linea); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  .aviso{ margin:0; font-size:0.84rem; }
  .aviso.error{ color:var(--error); font-weight:600; }
  .aviso.ok{ color:var(--ok); font-weight:600; }
  .aviso.ojo{ color:var(--alerta); font-weight:600; }

  /* El resumen del día elegido evita el error más caro de este formulario:
     anotar a diez personas en un día que ya estaba lleno. */
  #delDia{ margin:-8px 0 14px; font-size:0.8rem; color:var(--suave); min-height:1.1em; }
  #delDia b{ color:var(--tinta); }
</style>
</head>
<body>

<h1>Agregar una reserva</h1>

<div class="fila">
  <div style="flex:0 0 170px;">
    <label for="fecha">Fecha</label>
    <input type="text" id="fecha" placeholder="2026-10-17" autocomplete="off">
  </div>
  <div>
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" autocomplete="off">
  </div>
  <div>
    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" autocomplete="off">
  </div>
</div>

<p id="delDia"></p>

<fieldset>
  <legend>Cuántas personas</legend>
  <div class="menus">
    <div>
      <label for="tradiciones">Tradiciones</label>
      <input type="number" id="tradiciones" min="0" step="1" value="0">
    </div>
    <div>
      <label for="brasas">A Brasas abiertas</label>
      <input type="number" id="brasas" min="0" step="1" value="0">
    </div>
    <div>
      <label for="ninos">Niños</label>
      <input type="number" id="ninos" min="0" step="1" value="0">
    </div>
  </div>
  <p class="nota">Los niños cuentan para el cupo igual que los adultos.</p>
</fieldset>

<div class="fila">
  <div style="flex:0 0 200px;">
    <label for="estado">Estado del pago</label>
    <select id="estado">
      <option value="">Elegir…</option>
      <option value="pagada">Pagada</option>
      <option value="por pagar">Por pagar en el local</option>
    </select>
  </div>
  <div>
    <label for="telefono">Teléfono <span class="nota" style="display:inline">(opcional)</span></label>
    <input type="text" id="telefono" autocomplete="off">
  </div>
  <div>
    <label for="email">Email <span class="nota" style="display:inline">(opcional)</span></label>
    <input type="email" id="email" autocomplete="off">
  </div>
</div>

<div class="pie">
  <button id="guardar">Guardar la reserva</button>
  <button class="secundario" id="otra" style="display:none">Agregar otra</button>
  <p class="aviso" id="aviso"></p>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var DIAS = [];

  function texto(el, t, clase) {
    el.textContent = t || '';
    el.className = 'aviso' + (clase ? ' ' + clase : '');
  }

  // Lo que se sabe del día elegido, mientras se escribe. Es lo que evita
  // el error caro de este formulario: anotar gente en un día lleno.
  function mirarDia() {
    var f = $('fecha').value.trim();
    var caja = $('delDia');
    caja.innerHTML = '';
    if (!f) return;

    for (var i = 0; i < DIAS.length; i++) {
      if (DIAS[i].fecha !== f) continue;
      var d = DIAS[i];
      caja.innerHTML = 'Ese día: <b>' + d.tomadas + '</b> personas anotadas de ' +
        d.cupo + ', quedan <b>' + d.quedan + '</b>.' +
        (d.nota ? ' · ' + d.nota : '');
      return;
    }
    caja.innerHTML = 'Ese día <b>no está abierto</b>. Se puede anotar igual, ' +
      'pero no aparece en el panel hasta que lo abras.';
  }

  function recoger() {
    return {
      fecha: $('fecha').value.trim(),
      nombre: $('nombre').value.trim(),
      apellido: $('apellido').value.trim(),
      tradiciones: $('tradiciones').value,
      brasas: $('brasas').value,
      ninos: $('ninos').value,
      estado: $('estado').value,
      telefono: $('telefono').value.trim(),
      email: $('email').value.trim()
    };
  }

  function guardar() {
    $('guardar').disabled = true;
    texto($('aviso'), 'Guardando…');

    google.script.run
      .withSuccessHandler(function (r) {
        texto($('aviso'), 'Lista: ' + r.nombre + '.', 'ok');
        if (r.aviso) texto($('delDia'), r.aviso, 'ojo');
        // Los campos se limpian pero la FECHA se queda: cuando se anotan
        // varias reservas seguidas suelen ser del mismo día.
        ['nombre','apellido','telefono','email'].forEach(function (k) { $(k).value = ''; });
        ['tradiciones','brasas','ninos'].forEach(function (k) { $(k).value = '0'; });
        $('estado').value = '';
        $('guardar').disabled = false;
        $('nombre').focus();
        // Y se recargan los días, porque el cupo acaba de cambiar.
        cargar();
      })
      .withFailureHandler(function (e) {
        texto($('aviso'), (e && e.message ? e.message : e), 'error');
        $('guardar').disabled = false;
      })
      .guardarReservaManual(recoger());
  }

  function cargar() {
    google.script.run.withSuccessHandler(function (d) {
      DIAS = d.dias || [];
      // La fecha arranca en el próximo día abierto, que es lo que se
      // reserva el 90% de las veces.
      if (!$('fecha').value && DIAS.length) $('fecha').value = DIAS[0].fecha;
      mirarDia();
    }).datosDelFormulario();
  }

  $('fecha').addEventListener('input', mirarDia);
  $('guardar').addEventListener('click', guardar);
  cargar();
</script>

</body>
</html>
