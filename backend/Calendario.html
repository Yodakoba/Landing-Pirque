<!DOCTYPE html>
<!--
  Abrir y cerrar días, y cambiarles el cupo.

  Va en el proyecto de Apps Script como un archivo HTML llamado
  "Calendario". El nombre importa: abrirCalendario() lo busca así.

  LO QUE ESTO ESCRIBE SON EXCEPCIONES, NO DÍAS. Las fechas del sitio
  salen de una regla —qué días de la semana se abre— más una lista corta
  de excepciones. Por eso volver un día a su estado normal BORRA su fila
  en vez de escribir otra: si la pestaña Excepciones crece hasta tener un
  día por fila, el diseño se rompió.

  El calendario lo refleja: un día que sigue la regla se ve neutro, y uno
  con fila propia va marcado. Lo que está marcado es lo que alguien tuvo
  que decidir, y es lo único que hay que revisar.
-->
<html>
<head>
<base target="_top">
<style>
  :root{
    --gold:#9A7B18; --gold-claro:#C9A227; --wash:rgba(201,162,39,0.14);
    --tinta:#1A1A18; --suave:#5F5C55; --linea:#D8D5CC;
    --abierto:#3E7D4F; --cerrado:#B4B0A6; --alerta:#C9872A;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:18px 20px; background:#fff; color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:14px;
  }
  h1{ margin:0 0 4px; font-size:0.78rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.09em; color:var(--gold); }
  .bajada{ margin:0 0 14px; color:var(--suave); font-size:0.8rem; }

  .barra{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  /* Sin text-transform:capitalize: sube todas las palabras y deja
     "Octubre De 2026". La mayuscula inicial la pone el JS. */
  .barra b{ flex:1; font-size:1rem; }
  .barra button{ width:34px; height:30px; }

  button{
    padding:7px 14px; border:1px solid var(--linea); border-radius:3px;
    background:#fff; color:var(--tinta); cursor:pointer;
    font-family:inherit; font-size:0.84rem;
  }
  button:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); }
  button.lleno{ background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600; }
  button:disabled{ opacity:0.45; cursor:not-allowed; }

  table.mes{ width:100%; border-collapse:collapse; table-layout:fixed; }
  table.mes th{ font-size:0.68rem; color:var(--suave); font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em; padding-bottom:6px; }
  table.mes td{ padding:2px; }

  .dia{
    width:100%; height:58px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    border:1px solid var(--linea); border-radius:3px; background:#fff;
    cursor:pointer; font-family:inherit; padding:0;
  }
  .dia .n{ font-size:0.95rem; font-weight:600; line-height:1; }
  .dia .g{ font-size:0.66rem; color:var(--suave); line-height:1; }
  .dia.abierto{ border-color:var(--abierto); }
  .dia.abierto .n{ color:var(--abierto); }
  .dia.cerrado{ background:#FAF9F6; }
  /* Lleno no es lo mismo que cerrado, y confundirlos lleva a abrir un dia
     que ya estaba abierto y sin lugares. */
  .dia.lleno{ background:#FBEEDC; }
  .dia.lleno .g{ color:var(--alerta); font-weight:600; }
  .dia.cerrado .n{ color:var(--cerrado); }
  /* Marcado = alguien decidió algo para este día. Es lo que hay que revisar. */
  .dia.excepcion{ box-shadow: inset 0 0 0 2px var(--gold-claro); }
  .dia.elegido{ outline:2px solid var(--gold); outline-offset:1px; }
  .dia.pasado{ opacity:0.4; cursor:default; }
  .dia.vacio{ border:0; background:none; cursor:default; }

  .editor{
    margin-top:14px; border:1px solid var(--linea); border-radius:3px;
    padding:14px; background:#FAF9F6;
  }
  .editor h2{ margin:0 0 10px; font-size:0.92rem; }
  .editor .campos{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .editor label{ display:block; font-size:0.7rem; font-weight:600; color:var(--suave);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
  .editor input{ padding:7px 9px; border:1px solid var(--linea); border-radius:3px;
    font-family:inherit; font-size:0.88rem; }
  .editor .nota{ margin:10px 0 0; font-size:0.76rem; color:var(--suave); }
  .aviso{ margin:10px 0 0; font-size:0.82rem; }
  .aviso.error{ color:#A33; font-weight:600; }
  .aviso.ok{ color:var(--abierto); font-weight:600; }
  .estado{ padding:24px 0; color:var(--suave); font-size:0.85rem; }
</style>
</head>
<body>

<h1>Abrir y cerrar días</h1>
<p class="bajada">Los días con borde dorado tienen una regla propia. El resto siguen el horario normal.</p>

<div id="salida"><p class="estado">Cargando…</p></div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var MES = null;
  var ancla = null;
  var elegido = null;

  var SEMANA = ['L','M','X','J','V','S','D'];

  function cargar() {
    google.script.run
      .withSuccessHandler(function (m) { MES = m; dibujar(); })
      .withFailureHandler(function (e) {
        $('salida').innerHTML = '<p class="estado">No se pudo cargar: ' +
          escapar(e && e.message ? e.message : e) + '</p>';
      })
      .mesDelCalendario(ancla);
  }

  function escapar(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function nombreMes(anio, mes) {
    var d = new Date(anio, mes - 1, 1);
    var t = d.toLocaleDateString('es-CL', { month:'long', year:'numeric' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function mover(delta) {
    var mes = MES.mes + delta, anio = MES.anio;
    if (mes < 1) { mes = 12; anio--; }
    if (mes > 12) { mes = 1; anio++; }
    ancla = anio + '-' + ('0' + mes).slice(-2) + '-01';
    elegido = null;
    cargar();
  }

  function dibujar() {
    var s = $('salida');
    s.innerHTML = '';

    var barra = document.createElement('div');
    barra.className = 'barra';
    var antes = document.createElement('button'); antes.textContent = '‹';
    var titulo = document.createElement('b'); titulo.textContent = nombreMes(MES.anio, MES.mes);
    var desp = document.createElement('button'); desp.textContent = '›';
    antes.onclick = function () { mover(-1); };
    desp.onclick = function () { mover(1); };
    barra.appendChild(antes); barra.appendChild(titulo); barra.appendChild(desp);
    s.appendChild(barra);

    var tabla = document.createElement('table');
    tabla.className = 'mes';
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    for (var i = 0; i < 7; i++) {
      var th = document.createElement('th'); th.textContent = SEMANA[i]; trh.appendChild(th);
    }
    thead.appendChild(trh); tabla.appendChild(thead);

    var tbody = document.createElement('tbody');
    var tr = document.createElement('tr');
    // La semana parte en lunes, que es la convención chilena. getDay()
    // devuelve 0 para domingo, así que se corre.
    var hueco = (MES.dias[0].diaSemana + 6) % 7;
    for (var h = 0; h < hueco; h++) tr.appendChild(document.createElement('td'));

    for (var k = 0; k < MES.dias.length; k++) {
      var d = MES.dias[k];
      if ((hueco + k) % 7 === 0 && k) { tbody.appendChild(tr); tr = document.createElement('tr'); }

      var td = document.createElement('td');
      var b = document.createElement('button');
      var lleno = d.abierta && d.tomadas >= d.cupo;
      b.className = 'dia ' + (d.abierta ? 'abierto' : 'cerrado') +
        (lleno ? ' lleno' : '') +
        (d.excepcion ? ' excepcion' : '') + (d.pasado ? ' pasado' : '') +
        (elegido === d.fecha ? ' elegido' : '');
      b.innerHTML = '<span class="n">' + d.dia + '</span>' +
        '<span class="g">' + (d.abierta ? (d.tomadas + '/' + d.cupo) : '—') + '</span>';
      if (d.pasado) b.disabled = true;
      else b.onclick = (function (f) { return function () { elegido = f; dibujar(); }; })(d.fecha);
      td.appendChild(b); tr.appendChild(td);
    }
    tbody.appendChild(tr);
    tabla.appendChild(tbody);
    s.appendChild(tabla);

    if (elegido) s.appendChild(editorDe(elegido));
  }

  function editorDe(fecha) {
    var d = null;
    for (var i = 0; i < MES.dias.length; i++) if (MES.dias[i].fecha === fecha) d = MES.dias[i];
    if (!d) return document.createElement('div');

    var caja = document.createElement('div');
    caja.className = 'editor';

    var p = fecha.split('-');
    var leg = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]))
      .toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
    leg = leg.charAt(0).toUpperCase() + leg.slice(1);

    caja.innerHTML =
      '<h2>' + escapar(leg) + '</h2>' +
      '<div class="campos">' +
        '<div><label>Cupo</label><input type="number" id="cupo" min="0" step="1" style="width:90px" value="' + d.cupo + '"></div>' +
        '<div style="flex:1"><label>Nota</label><input type="text" id="nota" style="width:100%" value="' + escapar(d.nota) + '"></div>' +
        '<button id="alternar">' + (d.abierta ? 'Cerrar este día' : 'Abrir este día') + '</button>' +
        '<button id="guardar" class="lleno">Guardar</button>' +
      '</div>' +
      '<p class="nota" id="explica"></p>' +
      '<p class="aviso" id="aviso"></p>';

    // El texto explica qué va a quedar escrito, porque es lo que no se ve:
    // la diferencia entre "este día tiene regla propia" y "sigue el horario".
    setTimeout(function () {
      explicar(d, d.abierta);
      $('alternar').onclick = function () { aplicar(d, !d.abierta); };
      $('guardar').onclick = function () { aplicar(d, d.abierta); };
    }, 0);

    return caja;
  }

  function explicar(d, abierta) {
    var cupo = Number($('cupo').value) || 0;
    var nota = $('nota').value.trim();
    var sigueRegla = (abierta === d.porRegla);
    var cupoGeneral = (cupo === MES.cupoNormal || !cupo);

    if (sigueRegla && cupoGeneral && !nota) {
      $('explica').textContent =
        'Así queda siguiendo el horario normal, y su fila de Excepciones se borra. ' +
        'Es lo que corresponde: solo se guardan los días que se salen de la regla.';
    } else {
      $('explica').textContent =
        'Queda como excepción: ' + (abierta ? 'abierto' : 'cerrado') +
        (cupoGeneral ? '' : ', con cupo ' + cupo) +
        (nota ? ', "' + nota + '"' : '') + '.';
    }
  }

  function aplicar(d, abierta) {
    var cupo = Number($('cupo').value) || 0;
    var nota = $('nota').value.trim();
    $('guardar').disabled = true; $('alternar').disabled = true;
    $('aviso').textContent = 'Guardando…'; $('aviso').className = 'aviso';

    google.script.run
      .withSuccessHandler(function (r) {
        ancla = d.fecha;
        cargar();
      })
      .withFailureHandler(function (e) {
        $('aviso').textContent = (e && e.message ? e.message : e);
        $('aviso').className = 'aviso error';
        $('guardar').disabled = false; $('alternar').disabled = false;
      })
      .fijarDia(d.fecha, abierta, cupo, nota);
  }

  cargar();
</script>

</body>
</html>
