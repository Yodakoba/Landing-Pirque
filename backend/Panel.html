<!DOCTYPE html>
<!--
  Panel de reservas — pestaña "Ocupación".

  Este archivo va en el proyecto de Apps Script como un archivo HTML
  llamado "Panel" (Archivo → Nuevo → Archivo HTML). El nombre importa:
  abrirPanel() lo busca por ese nombre.

  Va claro y no con el negro de la marca a propósito: esto no es el sitio,
  es una herramienta de trabajo que se abre dentro de Google Sheets, y
  encima de una planilla blanca un panel negro se lee peor y choca. El
  dorado queda como acento, que es lo que ata las dos cosas.

  No usa ninguna librería. Son dos pantallas de datos: traer jQuery o un
  framework para esto sería cargar medio megabyte para dibujar una tabla.
-->
<html>
<head>
<base target="_top">
<style>
  :root{
    --gold:#9A7B18;          /* el dorado de la marca, oscurecido para leerse sobre blanco */
    --gold-claro:#C9A227;
    --tinta:#1A1A18;
    --tinta-sueve:#5F5C55;
    --linea:#E3E0D8;
    --fondo:#FFFFFF;
    --pagada:#3E7D4F;
    --por-pagar:#C9872A;
    --libre:#EDEAE2;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:18px 20px;
    font-family:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--tinta); background:var(--fondo); font-size:14px;
  }
  h1{
    margin:0 0 2px; font-size:0.78rem; font-weight:700;
    text-transform:uppercase; letter-spacing:0.09em; color:var(--gold);
  }
  .bajada{ margin:0 0 18px; color:var(--tinta-sueve); font-size:0.82rem; }

  /* La leyenda explica los colores una vez, para que la tabla no tenga
     que repetir la palabra "pagadas" en cada fila. */
  .leyenda{ display:flex; gap:16px; margin:0 0 14px; font-size:0.78rem; color:var(--tinta-sueve); }
  .leyenda span{ display:flex; align-items:center; gap:6px; }
  .pastilla{ width:11px; height:11px; border-radius:2px; display:inline-block; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:0.7rem; font-weight:600; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--tinta-sueve);
    padding:0 10px 8px 0; border-bottom:1px solid var(--linea);
  }
  th.n, td.n{ text-align:right; }
  td{ padding:11px 10px 11px 0; border-bottom:1px solid var(--linea); vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }

  /* Sin text-transform:capitalize: eso sube TODAS las palabras y deja
     "Sábado, 17 De Octubre". La mayúscula inicial la pone el JS. */
  .dia{ font-weight:600; }
  .dia small{ display:block; font-weight:400; color:var(--tinta-sueve); font-size:0.75rem;
    text-transform:none; margin-top:2px; }

  /* La barra es lo que se mira primero: el largo dice cuán lleno está el
     dia y el color dice cuánto de eso ya se cobró. */
  .barra{ display:flex; height:9px; border-radius:2px; overflow:hidden;
    background:var(--libre); min-width:120px; }
  .barra i{ display:block; height:100%; }
  .barra .p{ background:var(--pagada); }
  .barra .d{ background:var(--por-pagar); }

  .n b{ font-weight:600; }
  .deuda{ color:var(--por-pagar); font-weight:600; }
  .cero{ color:var(--tinta-sueve); font-weight:400; }
  .lleno{ color:var(--gold); font-weight:600; }

  .marca{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:2px;
    background:rgba(201,162,39,0.16); color:var(--gold);
    font-size:0.68rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
  }

  .estado{ padding:28px 0; color:var(--tinta-sueve); font-size:0.85rem; }
  .estado.error{ color:#A33; }
  .pie{ margin-top:16px; font-size:0.74rem; color:var(--tinta-sueve); }
</style>
</head>
<body>

<h1>Ocupación</h1>
<p class="bajada">Los próximos días abiertos. Incluye los que ya están llenos.</p>

<div class="leyenda">
  <span><i class="pastilla" style="background:var(--pagada)"></i> Pagadas</span>
  <span><i class="pastilla" style="background:var(--por-pagar)"></i> Por pagar en el local</span>
  <span><i class="pastilla" style="background:var(--libre)"></i> Libres</span>
</div>

<div id="salida"><p class="estado">Cargando…</p></div>

<script>
  var salida = document.getElementById('salida');

  function texto(el, t) { el.textContent = t; }

  // Los nombres de día y mes salen del navegador, no de una lista escrita
  // a mano: la planilla es chilena y el panel lo abre quien la administra.
  function nombreDia(iso) {
    var p = iso.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var t = d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function dibujar(datos) {
    if (!datos.dias || !datos.dias.length) {
      salida.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'estado';
      p.textContent = 'No hay días abiertos por delante. Revisa la pestaña Config.';
      salida.appendChild(p);
      return;
    }

    var html = '<table><thead><tr>' +
      '<th>Día</th><th>Reparto</th>' +
      '<th class="n">Personas</th><th class="n">Pagadas</th>' +
      '<th class="n">Por pagar</th><th class="n">Libres</th><th class="n">Cupo</th>' +
      '</tr></thead><tbody>';

    for (var i = 0; i < datos.dias.length; i++) {
      var d = datos.dias[i];
      var anchoP = d.cupo ? (d.pagadas / d.cupo) * 100 : 0;
      var anchoD = d.cupo ? (d.porPagar / d.cupo) * 100 : 0;

      var marca = '';
      if (d.quedan <= 0) marca = '<span class="marca">lleno</span>';
      else if (d.pocos) marca = '<span class="marca">últimos</span>';

      html += '<tr>' +
        '<td class="dia">' + escapar(nombreDia(d.fecha)) + marca +
          (d.nota ? '<small>' + escapar(d.nota) + '</small>' : '') + '</td>' +
        '<td><span class="barra">' +
          '<i class="p" style="width:' + anchoP.toFixed(1) + '%"></i>' +
          '<i class="d" style="width:' + anchoD.toFixed(1) + '%"></i>' +
        '</span></td>' +
        '<td class="n"><b>' + d.tomadas + '</b></td>' +
        '<td class="n">' + (d.pagadas ? d.pagadas : '<span class="cero">0</span>') + '</td>' +
        '<td class="n">' + (d.porPagar ? '<span class="deuda">' + d.porPagar + '</span>'
                                       : '<span class="cero">0</span>') + '</td>' +
        '<td class="n">' + (d.quedan <= 0 ? '<span class="lleno">0</span>' : d.quedan) + '</td>' +
        '<td class="n"><span class="cero">' + d.cupo + '</span></td>' +
      '</tr>';
    }

    html += '</tbody></table>';

    // El total de "por pagar" es el dato que se mira para saber cuánto hay
    // que cobrar en la puerta, así que va repetido abajo y no solo por día.
    var deuda = 0, gente = 0;
    for (var j = 0; j < datos.dias.length; j++) {
      deuda += datos.dias[j].porPagar;
      gente += datos.dias[j].tomadas;
    }
    html += '<p class="pie">' + gente + ' personas en total' +
            (deuda ? ', de las cuales <b>' + deuda + ' pagan en el local</b>.' : '. Todas pagadas.') +
            '</p>';

    salida.innerHTML = html;
  }

  function escapar(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function fallo(e) {
    salida.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'estado error';
    // El mensaje de Apps Script se muestra tal cual: acá lo lee quien
    // administra, no un visitante, y es lo que permite arreglarlo.
    p.textContent = 'No se pudo cargar: ' + (e && e.message ? e.message : e);
    salida.appendChild(p);
  }

  google.script.run.withSuccessHandler(dibujar).withFailureHandler(fallo).panelOcupacion();
</script>

</body>
</html>
